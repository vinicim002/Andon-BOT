spring:
  application:
    name: andon-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:andon}
    username: ${DB_USER:andon}
    password: ${DB_PASSWORD:}
  jpa:
    # Schema é responsabilidade exclusiva do Flyway.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
