# Ambiente local de desenvolvimento. Valores padrão apenas para a máquina de quem desenvolve;
# sobrescreva via .env (não versionado).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-andon}
      POSTGRES_USER: ${DB_USER:-andon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-andon_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
