<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover: libera env(safe-area-inset-*), para as abas e o campo de mensagem
         não ficarem atrás da barra de gestos do iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Cor da barra do navegador no celular, acompanhando o tema. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <title>Andon</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint, evitando o flash de tema claro.
      try {
        var t = localStorage.getItem('andon-theme');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
