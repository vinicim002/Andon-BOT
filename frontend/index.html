<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/andon-symbol.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andon</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint, evitando o flash de tema claro.
      try {
        var t = localStorage.getItem('andon-theme');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
